# The stack the OWASP ZAP API scan (`make dast`, scripts/dast.sh) attacks.
#
# An override of docker-compose.e2e.yml, used as:
#   docker compose -p map-my-friends-dast \
#     -f docker-compose.e2e.yml -f docker-compose.dast.yml ...
# It keeps the E2E stack's Firestore emulator and third-party stubs, and runs
# the API the way production does, because a scan of a DEBUG server reports
# DEBUG's behaviour (verbose error pages, CORS open to every origin, mock
# Auth0 tokens accepted) rather than what users actually reach:
#   - DEBUG off, a random SECRET_KEY (scripts/dast.sh makes one per run)
#   - gunicorn, as in docker-compose.prod.yml, after collectstatic, so static
#     files come from WhiteNoise's manifest storage as they do in production
#   - the code baked into the image, not bind-mounted from the host
#   - gunicorn's access log on, so scripts/dast.sh can count what the API
#     answered (many 429s would mean the scan hit a throttle)
#
# The one deliberate difference from production is the throttle rates, raised
# for the E2E stack too; see docker/test-stack-settings/unthrottled_settings.py.
services:
  api:
    image: map-my-friends-backend:dast
    command: >
      sh -c "python manage.py collectstatic --noinput >/dev/null &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    # Only the settings overlay; the code is the image's.
    volumes: !override
      - ./docker/test-stack-settings:/test-stack-settings:ro
    ports: !override
      - "${DAST_API_PORT:-8200}:8000"
    environment:
      - DJANGO_DEBUG=False
      # Required: the stack refuses to start without one. scripts/dast.sh
      # passes a fresh random key; there is no default on purpose.
      - DJANGO_SECRET_KEY=${DAST_SECRET_KEY:?set DAST_SECRET_KEY, or run make dast}
      # "api" is the host name ZAP uses on the compose network, and localhost
      # is how scripts/dast.sh reaches the published port.
      - ALLOWED_HOSTS=api,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      # Without the E2E stack's request log (e2e_settings.py).
      - DJANGO_SETTINGS_MODULE=unthrottled_settings
      - DJANGO_SQLITE_PATH=/tmp/dast.sqlite3

  stubs:
    # The API reaches the stubs on the compose network; nothing on the host
    # needs them, so their port isn't published.
    ports: !reset []
