name: map_my_friends_widgetbook
description: "Widgetbook catalog for Map My Friends components and screens."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The app under catalog. A path dependency, so every use case renders the
  # widget the app ships rather than a copy of it.
  map_my_friends:
    path: ../

  # 3.23 is the newest release that supports Flutter 3.41, the SDK CI pins.
  # 3.24 onward requires Flutter 3.44; bump both together.
  widgetbook: ^3.23.0
  widgetbook_annotation: ^3.11.0
  # Drives the Accessibility addon; the version widgetbook already resolves.
  accessibility_tools: ^2.6.0

  # Shared with the app; constrained to what the app already resolves.
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  flutter_map: ^8.2.2
  flutter_map_tile_caching: ^10.1.1
  geolocator: ^14.0.2
  latlong2: ^0.9.0
  shared_preferences: ^2.5.4
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  widgetbook_generator: ^3.20.0

flutter:
  uses-material-design: true
