# The app's analysis settings, so the harness is held to the same bar. CI runs
# `flutter analyze`, which fails on any issue, including infos.
#
# Start from the recommended Flutter lints, then add the stricter checks below.
# They are chosen to catch bugs, not to enforce a style: `dart format` already
# owns layout.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No implicit downcasts from dynamic. Most of the app's data arrives as
    # decoded JSON, and an implicit cast there hides where a bad payload
    # throws. Casts have to be written out.
    strict-casts: true
    # Fail when a type argument or return type would silently fall back to
    # dynamic, e.g. `dio.get(...)` or `showDialog(...)` with no type.
    strict-inference: true
    # No raw generic types like `List` or `Future` with the arguments left off.
    strict-raw-types: true

linter:
  rules:
    # Calls on dynamic values aren't type-checked at all.
    - avoid_dynamic_calls

    # Async mistakes: a future nobody awaits loses its errors, and an open
    # stream or subscription leaks.
    - unawaited_futures
    - unnecessary_await_in_return
    - cancel_subscriptions
    - close_sinks
    - avoid_slow_async_io

    # Errors: throw only Error/Exception types, and never from a finally
    # block, which discards the original error.
    - only_throw_errors
    - throw_in_finally

    # Code that does nothing or doesn't do what it looks like it does.
    - unnecessary_statements
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    # runtimeType.toString() changes under minification on web.
    - avoid_type_to_string

    # A local that is never reassigned should say so.
    - prefer_final_locals
